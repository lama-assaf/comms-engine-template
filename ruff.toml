# What CI checks before the tests run: syntax errors, undefined names, unused imports and
# variables (pyflakes), where imports sit in a file, and the statement rules that catch a
# slip (a bare except, a comparison to None with ==). Not a style pass: the scripts keep
# their long lines and their short loop names.
#
#   python3 -m pip install -r requirements-dev.txt && ruff check Tooling
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E702",  # two short statements on one line, as the drawing and parsing code writes them
    "E741",  # `l` for a line or a layer
]
